                $ref: "#/components/schemas/OwnerPanelAccessList"
        "400":
          description: Unknown account or trying to revoke yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/unlock-account:
    post:
      operationId: ownerUnlockAccount
