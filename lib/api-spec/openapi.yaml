openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Blacket-style game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: player
  - name: blooks
  - name: packs
  - name: bazaar
  - name: chat
  - name: social
  - name: trades
  - name: blookgen
  - name: coowner
paths:
  /blookgen/generate:
    post:
      operationId: generateBlook
      tags: [blookgen]
      summary: Generate a custom blook image from a description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlookGenInput"
      responses:
        "200":
          description: Generated blook image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedBlook"
        "400":
          description: Invalid description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [player]
      summary: Get current player profile
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    patch:
      operationId: updateMe
      tags: [player]
      summary: Update player settings (avatar blook, banner color)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /me/claim:
    post:
      operationId: claimTokens
      tags: [player]
      summary: Claim the timed token reward
      responses:
        "200":
          description: Claim result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "400":
          description: Claim not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid input or username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Registration blocked (IP ban)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Account is banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change your password (requires the current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: List friends and pending friend requests
      responses:
        "200":
          description: Friends overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsOverview"
  /friends/requests:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestInput"
      responses:
        "200":
          description: Request sent (or auto-accepted if they already asked you)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestResult"
        "400":
          description: Invalid target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept an incoming friend request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No such pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /friends/requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline (or cancel) a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No such pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /friends/{username}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /gifts/send:
    post:
      operationId: sendGift
      tags: [friends]
      summary: Send a one-way gift (tokens and/or blooks) to another player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftSendInput"
      responses:
        "200":
          description: Gift delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid gift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /dms/conversations:
    get:
      operationId: getDmConversations
      tags: [dms]
      summary: List DM conversations (latest message per partner)
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/DmConversation"
                required: [conversations]
  /dms/with/{username}:
    get:
      operationId: getDmThread
      tags: [dms]
      summary: Get the DM thread with a player (marks it read)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmThread"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: sendDm
      tags: [dms]
      summary: Send a DM (optionally gifting a blook from your collection)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmMessage"
        "400":
          description: Empty message / blook not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /dms/messages/{id}/claim:
    post:
      operationId: claimDmGift
      tags: [dms]
      summary: Claim a blook gift sent to you
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  blookName: { type: string }
                  image: { type: string }
                required: [message, blookName, image]
        "404":
          description: No unclaimed gift for you with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /discord-link:
    get:
      operationId: getDiscordLink
      tags: [social]
      summary: Get the public Discord invite link
      responses:
        "200":
          description: Discord invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLink"
  /admin/discord-link:
    post:
      operationId: adminSetDiscordLink
      tags: [admin]
      summary: Update the public Discord invite link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDiscordLinkInput"
      responses:
        "200":
          description: Updated Discord invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLink"
        "400":
          description: Invalid Discord invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/lookup:
    post:
      operationId: adminLookup
      tags: [admin]
      summary: Verify the admin password and fetch grantable badges/blooks/players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthInput"
      responses:
        "200":
          description: Admin data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLookup"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/grant-badge:
    post:
      operationId: adminGrantBadge
      tags: [admin]
      summary: Grant a badge to a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantBadgeInput"
      responses:
        "200":
          description: Badge granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantBadgeResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player or badge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/grant-blook:
    post:
      operationId: adminGrantBlook
      tags: [admin]
      summary: Request an owner-approved blook grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantBlookInput"
      responses:
        "200":
          description: Blook grant request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantBlookResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/grant-mod:
    post:
      operationId: adminGrantMod
      tags: [admin]
      summary: Grant a player the Mod badge and mod-panel access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantModInput"
      responses:
        "200":
          description: Mod access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantModResult"
        "400":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player or blook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/update-badges:
    post:
      operationId: adminUpdateBadges
      tags: [admin]
      summary: Add and/or remove multiple badges on a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateBadgesInput"
      responses:
        "200":
          description: Badges updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantBadgeResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player or badge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/rename-player:
    post:
      operationId: adminRenamePlayer
      tags: [admin]
      summary: Rename a player to a new username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRenamePlayerInput"
      responses:
        "200":
          description: Player renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRenamePlayerResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: New username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/reset-password:
    post:
      operationId: adminResetPassword
      tags: [admin]
      summary: Reset a player's password to a random 4-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResetPasswordResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/set-name-effect:
    post:
      operationId: adminSetNameEffect
      tags: [admin]
      summary: Set or clear a player's username effect (e.g. rainbow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetNameEffectInput"
      responses:
        "200":
          description: Name effect updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetNameEffectResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/gift-all-blooks:
    post:
      operationId: adminGiftAllBlooks
      tags: [admin]
      summary: Gift N copies of every blook in the game to a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGiftAllBlooksInput"
      responses:
        "200":
          description: Blooks gifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGiftAllBlooksResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/delete-players:
    post:
      operationId: adminDeletePlayers
      tags: [admin]
      summary: Permanently delete players and all their data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDeletePlayersInput"
      responses:
        "200":
          description: Players deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeletePlayersResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/purge-link-messages:
    post:
      operationId: adminPurgeLinkMessages
      tags: [admin]
      summary: Delete all chat messages containing links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordInput"
      responses:
        "200":
          description: Link messages purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPurgeLinkMessagesResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/give-tokens-all:
    post:
      operationId: adminGiveTokensAll
      tags: [admin]
      summary: Give tokens to every player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGiveTokensAllInput"
      responses:
        "200":
          description: Tokens distributed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGiveTokensAllResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/give-tokens:
    post:
      operationId: adminGiveTokens
      tags: [admin]
      summary: Give tokens to a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGiveTokensInput"
      responses:
        "200":
          description: Tokens given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGiveTokensResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/grants:
    post:
      operationId: adminListGrants
      tags: [admin]
      summary: List all admin-granted starter bundles (who gave, who received)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordInput"
      responses:
        "200":
          description: List of grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantList"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/grant-bundle:
    post:
      operationId: adminGrantBundle
      tags: [admin]
      summary: Request an owner-approved Starter Bundle grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantBundleInput"
      responses:
        "200":
          description: Starter Bundle grant request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantBundleResult"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/grant-requests:
    post:
      operationId: ownerListGrantRequests
      tags: [owner]
      summary: List pending blook and Starter Bundle approval requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerPasswordInput"
      responses:
        "200":
          description: Pending grant requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantRequestList"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/grant-requests/approve:
    post:
      operationId: ownerApproveGrantRequest
      tags: [owner]
      summary: Approve and fulfill one pending grant request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerGrantRequestDecisionInput"
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantRequest"
        "400":
          description: Request cannot be approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/grant-requests/reject:
    post:
      operationId: ownerRejectGrantRequest
      tags: [owner]
      summary: Reject one pending grant request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerGrantRequestDecisionInput"
      responses:
        "200":
          description: Rejected request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantRequest"
        "400":
          description: Request cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /coowner/lookup:
    post:
