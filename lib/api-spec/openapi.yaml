      responses:
        "200":
          description: Account unlocked for a one-time password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Unknown account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/ip-bans:
    post:
      operationId: adminListIpBans
