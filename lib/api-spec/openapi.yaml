      responses:
        "200":
          description: IP bans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIpBanList"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/ip-bans/ban:
    post:
      operationId: adminIpBan
      tags: [admin]
      summary: Ban a player's account and their last IP (blocks new signups from that IP only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIpBanInput"
      responses:
        "200":
          description: Updated IP bans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIpBanList"
        "400":
          description: Unknown account or no IP recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/ip-bans/unban:
    post:
      operationId: adminIpUnban
      tags: [admin]
      summary: Remove an IP ban (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIpUnbanInput"
      responses:
        "200":
          description: Updated IP bans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIpBanList"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/mod-badges:
    post:
      operationId: ownerListModBadges
      tags: [owner]
      summary: List accounts holding the Mod badge (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerPasswordInput"
      responses:
        "200":
          description: Mod badge holders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerModBadgeList"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/pfp/set:
    post:
      operationId: ownerSetPlayerPfp
      tags: [owner]
      summary: Set a player's custom profile picture from an uploaded image (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerSetPfpInput"
      responses:
        "200":
          description: Updated player avatar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerPfpResult"
        "400":
          description: Unknown account or invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/pfp/remove:
    post:
      operationId: ownerRemovePlayerPfp
      tags: [owner]
      summary: Remove a player's custom profile picture (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerRemovePfpInput"
      responses:
        "200":
          description: Player avatar reset to their equipped blook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerPfpResult"
        "400":
          description: Unknown account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/mod-badges/set:
    post:
      operationId: ownerSetModBadge
      tags: [owner]
      summary: Approve a Mod badge holder for the mod panel, or decline and strip the badge (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerModBadgeSetInput"
      responses:
        "200":
          description: Updated Mod badge holders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerModBadgeList"
        "400":
          description: Unknown account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /owner/clans/set-level:
    post:
      operationId: ownerSetClanLevel
      tags: [owner]
      summary: Set or reset a clan's level (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerSetClanLevelInput"
      responses:
        "200":
          description: Updated clan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerClanInfo"
        "401":
          description: Wrong owner password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Clan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /online-count:
    get:
      operationId: getOnlineCount
      tags: [social]
      summary: Get the number of players currently online
      responses:
        "200":
          description: Online player count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineCount"
  /trades/requests:
    get:
      operationId: getTradeRequests
      tags: [trades]
      summary: Get my pending incoming and outgoing trade requests
      responses:
        "200":
          description: Pending trade requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRequestList"
    post:
      operationId: sendTradeRequest
      tags: [trades]
      summary: Send a trade request to a player by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequestInput"
      responses:
        "201":
          description: Created request (if the target is a bot it may be auto-accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRequest"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/requests/{id}/accept:
    post:
      operationId: acceptTradeRequest
      tags: [trades]
      summary: Accept an incoming trade request (starts the trade)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The trade that was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: Cannot accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/requests/{id}/decline:
    post:
      operationId: declineTradeRequest
      tags: [trades]
      summary: Decline an incoming trade request (or cancel an outgoing one)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Cannot decline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/current:
    get:
      operationId: getCurrentTrade
      tags: [trades]
      summary: Get the current trade state (also advances the partner's behavior)
      responses:
        "200":
          description: Current trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "404":
          description: No active trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/current/offer:
    put:
      operationId: updateTradeOffer
      tags: [trades]
      summary: Replace my side of the trade offer (clears both sides' accepts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeOfferInput"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: Invalid offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/current/accept:
    post:
      operationId: acceptTrade
      tags: [trades]
      summary: Toggle my acceptance of the current offers (completes the trade when both accept)
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: No active trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/current/decline:
    post:
      operationId: declineTrade
      tags: [trades]
      summary: Decline and end the current trade
      responses:
        "200":
          description: Declined trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: No active trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /trades/current/messages:
    get:
      operationId: getTradeMessages
      tags: [trades]
      summary: Get private trade chat messages (newest last)
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
          description: Only return messages with id greater than this
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendTradeMessage
      tags: [trades]
      summary: Send a private trade chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    BlookGenInput:
      type: object
      properties:
        description: { type: string, minLength: 2, maxLength: 300 }
      required: [description]
    GeneratedBlook:
      type: object
      properties:
        imageDataUrl: { type: string }
      required: [imageDataUrl]
    Player:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        tokens: { type: integer }
        experience: { type: integer }
        level: { type: integer }
        avatarBlook: { type: ["string", "null"] }
        avatarImage: { type: ["string", "null"] }
        bannerColor: { type: ["string", "null"] }
        packsOpened: { type: integer }
        uniqueBlooks: { type: integer }
        totalBlooks: { type: integer }
        nextClaimAt: { type: ["string", "null"] }
        nameEffect: { type: ["string", "null"] }
        chatColor: { type: ["string", "null"], description: "Custom chat text color (#rrggbb) or null for default" }
        hasBundle: { type: boolean, description: "Owns the Starter Bundle (unlocks custom chat/name colors)" }
        clanBoosts: { type: integer, description: "Unused clan level boosts (+10 levels each)" }
        rainbowPerks: { type: integer, description: "Unattached rainbow clan name perks" }
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        createdAt: { type: string }
      required:
        [id, username, tokens, experience, level, avatarBlook, avatarImage, bannerColor, packsOpened, uniqueBlooks, totalBlooks, nextClaimAt, clanBoosts, rainbowPerks, badges, createdAt]
    PlayerUpdate:
      type: object
      properties:
        avatarBlook: { type: string }
        bannerColor: { type: string }
        username: { type: string, minLength: 3, maxLength: 20 }
        currentPassword: { type: string, minLength: 1, maxLength: 100, description: "Required when changing username: the account's current password" }
        chatColor: { type: ["string", "null"], description: "Custom chat text color (#rrggbb); null resets to default (Starter Bundle perk)" }
        nameColor: { type: string, description: "Custom name color (#rrggbb) or 'golden' to switch back (Starter Bundle perk)" }
    ClaimResult:
      type: object
      properties:
        claimed: { type: boolean }
        tokensAwarded: { type: integer }
        tokens: { type: integer }
        nextClaimAt: { type: string }
      required: [claimed, tokensAwarded, tokens, nextClaimAt]
    Rarity:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
        animation: { type: string }
        exp: { type: integer }
      required: [name, color, animation, exp]
    BlookDef:
      type: object
      properties:
        name: { type: string }
        rarity: { type: string }
        chance: { type: number }
        price: { type: integer }
        image: { type: string }
        pack: { type: ["string", "null"] }
      required: [name, rarity, chance, price, image, pack]
    CraftPreviewInput:
      type: object
      properties:
        blooks:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 5
      required: [blooks]
    CraftOutcome:
      type: object
      properties:
        name: { type: string }
        rarity: { type: string }
        image: { type: string }
        price: { type: integer }
        chance: { type: number, description: "Percent chance without luck" }
        luckChance: { type: number, description: "Percent chance with the 2.5x luck item" }
      required: [name, rarity, image, price, chance, luckChance]
    CraftPreview:
      type: object
      properties:
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/CraftOutcome"
        luckItems: { type: integer, description: "2.5x luck items the player owns" }
      required: [outcomes, luckItems]
    CraftInput:
      type: object
      properties:
        blooks:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 5
        useLuck: { type: boolean }
      required: [blooks, useLuck]
    CraftResult:
      type: object
      properties:
        blook:
          type: object
          properties:
            name: { type: string }
            rarity: { type: string }
            image: { type: string }
            price: { type: integer }
          required: [name, rarity, image, price]
        isNew: { type: boolean }
        usedLuck: { type: boolean }
        luckItemsLeft: { type: integer }
      required: [blook, isNew, usedLuck, luckItemsLeft]
    OwnedBlook:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer }
        rarity: { type: string }
        image: { type: string }
        price: { type: integer }
        pack: { type: ["string", "null"] }
        firstObtainedAt: { type: string }
        clanEffect:
          type: ["string", "null"]
          description: "Server-defined clan power granted while this blook is held by a clan. Every blook has one: Mysticals grant a unique aura, all others pay the clan token mine at a rarity-scaled rate."
      required: [name, quantity, rarity, image, price, pack, firstObtainedAt, clanEffect]
    SellRequest:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
      required: [name, quantity]
    SellResult:
      type: object
      properties:
        tokensEarned: { type: integer }
        tokens: { type: integer }
        remainingQuantity: { type: integer }
      required: [tokensEarned, tokens, remainingQuantity]
    BaseWorker:
      type: object
      properties:
        id: { type: integer }
        blookName: { type: string }
        rarity: { type: string }
        image: { type: string }
        tokenRatePerHour: { type: integer }
        sellValue: { type: integer }
        assignedAt: { type: string, format: date-time }
      required: [id, blookName, rarity, image, tokenRatePerHour, sellValue, assignedAt]
    BaseWorkerInput:
      type: object
      properties:
        blookNames:
          type: array
          items: { type: string, minLength: 1 }
          minItems: 1
          maxItems: 30
      required: [blookNames]
    BaseWorkerAssignment:
      type: object
      properties:
        deployedCount: { type: integer }
        skippedCount: { type: integer }
        base: { $ref: "#/components/schemas/BaseStatus" }
      required: [deployedCount, skippedCount, base]
    BaseStatus:
      type: object
      properties:
        unlocked: { type: boolean }
        level: { type: integer }
        levelRequired: { type: integer }
        tokensReady: { type: integer }
        tokenRatePerHour: { type: integer }
        maxWorkers: { type: integer }
        nextSlotCost: { type: integer }
        workers:
          type: array
          items:
            $ref: "#/components/schemas/BaseWorker"
      required: [unlocked, level, levelRequired, tokensReady, tokenRatePerHour, maxWorkers, nextSlotCost, workers]
    BaseClaimResult:
      type: object
      properties:
        claimed: { type: boolean }
        tokensAwarded: { type: integer }
        tokens: { type: integer }
        base:
          $ref: "#/components/schemas/BaseStatus"
      required: [claimed, tokensAwarded, tokens, base]
    BaseDismissResult:
      type: object
      properties:
        tokensAwarded: { type: integer }
        tokens: { type: integer }
        base:
          $ref: "#/components/schemas/BaseStatus"
      required: [tokensAwarded, tokens, base]
    BaseBuySlotResult:
      type: object
      properties:
        tokens: { type: integer }
        base:
          $ref: "#/components/schemas/BaseStatus"
      required: [tokens, base]
    Pack:
      type: object
      properties:
        name: { type: string }
        price: { type: integer }
        color1: { type: string }
        color2: { type: string }
        image: { type: string }
        blooks:
          type: array
          items:
            $ref: "#/components/schemas/BlookDef"
        remaining:
          type: integer
          nullable: true
          description: "Global supply left for limited packs (Top pack); null/absent for normal packs"
      required: [name, price, color1, color2, image, blooks]
    PackOpenResult:
      type: object
      properties:
        blook:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BlookDef"
          description: "Null when a Top-pack open comes up empty"
        isNew: { type: boolean }
        tokens: { type: integer }
        experience: { type: integer }
        level: { type: integer }
        pullId: { type: integer, nullable: true, description: "Id of the logged pack pull — pass to sharePullId to flex it in DMs; null on an empty Top-pack open" }
      required: [blook, isNew, tokens, experience, level, pullId]
    BazaarListing:
      type: object
      properties:
        id: { type: integer }
        sellerName: { type: string }
        sellerNameEffect: { type: ["string", "null"] }
        blookName: { type: string }
        rarity: { type: string }
        image: { type: string }
        price: { type: integer }
        pack: { type: ["string", "null"] }
        isMine: { type: boolean }
        createdAt: { type: string }
      required: [id, sellerName, blookName, rarity, image, price, pack, isMine, createdAt]
    BazaarListingInput:
      type: object
      properties:
        blookName: { type: string }
        price: { type: integer, minimum: 1, maximum: 1000000000 }
      required: [blookName, price]
    BazaarBuyResult:
      type: object
      properties:
        blookName: { type: string }
        price: { type: integer }
        tokens: { type: integer }
      required: [blookName, price, tokens]
    StoreOffer:
      type: object
      properties:
        available: { type: boolean }
        priceAmount: { type: ["integer", "null"], description: "Price in cents" }
        currency: { type: ["string", "null"] }
        tokens: { type: integer }
        alreadyPurchased: { type: boolean }
        freeForYou: { type: boolean, description: "This account can claim the bundle for free" }
        chromaBlooks:
          type: array
          description: "All possible Chroma blooks (name + image) the bundle can grant"
          items:
            type: object
            properties:
              name: { type: string }
              image: { type: ["string", "null"] }
            required: [name, image]
      required: [available, priceAmount, currency, tokens, alreadyPurchased, freeForYou, chromaBlooks]
    StoreCheckout:
      type: object
      properties:
        url: { type: ["string", "null"] }
      required: [url]
    StoreClaimInput:
      type: object
      properties:
        sessionId: { type: string, minLength: 1 }
      required: [sessionId]
    StoreClaimResult:
      type: object
      properties:
        alreadyClaimed: { type: boolean }
        tokens: { type: integer }
        blooks:
          type: array
          description: "The blooks granted by this bundle (normally 2 Chromas; 1% chance each is a Mystical)"
          items:
            type: object
            properties:
              name: { type: string }
              rarity: { type: string }
              image: { type: ["string", "null"] }
            required: [name, rarity, image]
      required: [alreadyClaimed, tokens, blooks]
    ChatMessage:
      type: object
      properties:
        id: { type: integer }
        author: { type: string }
        avatarBlook: { type: ["string", "null"] }
        avatarImage: { type: ["string", "null"] }
        nameEffect: { type: ["string", "null"] }
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        content: { type: string }
        mentions:
          type: array
          items: { type: string }
        mentionEffects:
          type: object
          additionalProperties: { type: ["string", "null"] }
        isMine: { type: boolean }
        createdAt: { type: string }
        clanName: { type: ["string", "null"] }
        clanColor: { type: ["string", "null"] }
        chatColor: { type: ["string", "null"] }
      required: [id, author, avatarBlook, avatarImage, badges, content, mentions, isMine, createdAt, clanName, clanColor]
    ChatMessageInput:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
      required: [content]
    MyClanMembership:
      type: object
      required: [inClan, banned]
      properties:
        inClan:
          type: boolean
        banned:
          type: boolean
        clanId:
          type: integer
          nullable: true
        clanName:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
    ClanSummary:
      type: object
      properties:
